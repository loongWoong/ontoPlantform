  <text x="68.20" y="38.50" fill="#111827" font-family="inherit" font-size="20" font-weight="700">轻量本体工程 · 平台支撑逻辑</text>
  <text x="68.20" y="59.40" fill="#1f2937" font-family="inherit" font-size="11">第一轮先打通一条「CQ → 模型 → 样例 → 查询」链路；之后每轮换一批 CQ 螺旋推进</text>
  <text x="68.20" y="95.70" fill="#111827" font-family="inherit" font-size="12" font-weight="600">一轮流程（8 步，可跳步 / 可回退）</text>
  <text x="341.20" y="95.70" fill="#111827" font-family="inherit" font-size="12" font-weight="600">平台支撑（每一步的落点）</text>
  <text x="168.70" y="197.00" fill="#1f2937" font-family="inherit" font-size="10">目的</text>
  <text x="168.70" y="287.00" fill="#1f2937" font-family="inherit" font-size="10">CQ 可判定</text>
  <text x="168.70" y="377.00" fill="#1f2937" font-family="inherit" font-size="10">用 / 不用</text>
  <text x="168.70" y="467.00" fill="#1f2937" font-family="inherit" font-size="10">术语认可</text>
  <text x="168.70" y="557.00" fill="#1f2937" font-family="inherit" font-size="10">可加载</text>
  <text x="168.70" y="647.00" fill="#1f2937" font-family="inherit" font-size="10">每条有数据</text>
  <text x="168.70" y="737.00" fill="#1f2937" font-family="inherit" font-size="10">达阈值</text>
  <text x="68.20" y="849.00" fill="#111827" font-family="inherit" font-size="10">硬门禁只拦「发布」：CQ 通过率达到约定阈值 + 评审通过；其余步骤是软提示，允许跳步和回退。</text>
  <text x="68.20" y="867.00" fill="#1f2937" font-family="inherit" font-size="10">证据包 = CQ 验收查询 + 样例数据哈希 + 本体指纹；同一份证据可在下一轮重放。</text>
  <text x="68.20" y="887.00" fill="#1f2937" font-family="inherit" font-size="10">颜色：蓝 = 对齐 · 绿 = 设计 · 琥珀 = 实现 · 玫红 = 验证 · 紫 = 发布</text>
</svg>
