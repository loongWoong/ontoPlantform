[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "onto-platform"
version = "0.3.0"
description = "OntoPlatform v0.2 - build, govern and use a semantic business world on top of the Ontology Runtime Kernel"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
# Domain / Application / Ports are zero-dependency by design (design.txt §37).
# The Kernel is an infrastructure concern and is imported lazily.
dependencies = []

[project.optional-dependencies]
kernel = ["ontology-runtime>=0.1.1"]
mcp = ["mcp>=1.0"]
dev = [
    "pytest>=8.0",
    "ontology-runtime>=0.1.1",
    # W0 test guard rails (optional, not runtime dependencies)
    "pytest-timeout>=2.3",
    "coverage[toml]>=7.4",
    "hypothesis>=6.98",
]

[project.scripts]
onto = "onto_platform.interfaces.cli:main"
onto-api = "onto_platform.interfaces.api:main"
onto-mcp = "onto_platform.interfaces.mcp:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools]
include-package-data = true

# The React console is built into the package (frontend/ -> interfaces/web/dist),
# so an installed wheel serves the full console with no Node at runtime.
[tool.setuptools.package-data]
"onto_platform.interfaces" = [
  "web/index.html",
  "web/dist/index.html",
  "web/dist/assets/*",
  "web/dist/*",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers"
markers = [
  "slow: long-running end-to-end scenario",
  "integration: needs the kernel/runtime (not pure domain)",
  "http: exercises the REST adapter on a real socket",
]
# timeout = 30 requires pytest-timeout (dev extra); skipped when absent.

[tool.coverage.run]
source = ["onto_platform"]
branch = true

[tool.coverage.report]
show_missing = true
# W0 floor: domain/application stay the strongly covered layers; the kernel
# gateway and HTTP shell are exercised end to end instead of unit-covered.
fail_under = 70
